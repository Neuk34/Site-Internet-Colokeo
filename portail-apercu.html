<script>
(()=>{const r=document.getElementById('ck'),m=r.querySelector('main');let stage='candidat',page='Accueil';const row=(i,t,s,a='',end='›')=>`<button class="row" data-action="${a}"><span class="ico"><i data-lucide="${i}"></i></span><span><strong>${t}</strong><small>${s}</small></span><span class="end">${end}</span></button>`;const head=(t,s)=>`<div class="eyebrow">Angers · Chambre Jardin</div><h2>${t}</h2><p class="subtitle">${s}</p>`;const hero=(tag,t,s,b,a)=>`<div class="hero"><span class="tag">${tag}</span><h3>${t}</h3><p>${s}</p><button class="cta" data-action="${a}">${b} →</button></div>`;const section=(t,s='')=>`<div class="section">${t}<small>${s}</small></div>`;function icons(){if(window.lucide)lucide.createIcons();}
function render(){r.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='Accueil'){if(stage==='candidat')m.innerHTML=head('Votre prochaine coloc,<br>ça commence ici.','Bonjour Léa, votre candidature avance.')+hero('Candidature en cours','Un dernier document','Ajoutez votre justificatif pour que Nicolas puisse examiner votre dossier.','Compléter mon dossier','dossier')+section('Votre candidature','3 étapes sur 4')+row('check','Profil renseigné','Vos informations sont enregistrées','dossier','✓')+row('calendar-days','Choisir une visite','Rencontrez vos futurs colocataires','cal')+row('house','Découvrez la maison','5 chambres · Règles de vie · Espaces communs','coloc');else if(stage==='arrivee')m.innerHTML=head('Bienvenue chez vous,<br>Léa.','Votre arrivée est prévue le 1er novembre.')+hero('Candidature acceptée','Préparons votre arrivée','Votre bail est prêt. Consultez-le pour poursuivre les démarches.','Consulter mon bail','dossier')+section('Avant de poser vos valises','1 / 4 terminé')+row('check','Dossier validé','Votre candidature a été acceptée','dossier','✓')+row('shield-check','Assurance habitation','Attestation à transmettre','dossier')+row('clipboard-check','État des lieux d’entrée','Préparer vos observations et vos photos','edl')+row('key-round','Remise des clés','Rendez-vous à organiser','cal');else m.innerHTML=head('Votre coloc,<br>en toute simplicité.','Bonjour Léa · Mercredi 14 octobre')+hero('À vous cette semaine','La cuisine vous attend','Plan de travail, plaques et sol : votre tâche d’entretien de la semaine.','Voir ma tâche','entretien')+section('Cette semaine','12 – 18 octobre')+row('calendar-days','Une visite vendredi','18:30 · Vous accueillez Camille','cal')+row('wallet','Loyer d’octobre','430 € · Paiement enregistré','dossier','✓')+row('clipboard-check','État des lieux','Votre constat d’entrée et vos photos','edl');}
else if(page==='La coloc')m.innerHTML=head('La vie à la maison.','Vos informations communes, à portée de main.')+row('sparkles','Entretien','Planning et rotation des tâches','entretien')+row('calendar-days','Calendrier','Visites, disponibilités et interventions','cal')+row('book-open','Guide de la maison','Wi-Fi, équipements et contacts utiles','guide');
else if(page==='Mon dossier')m.innerHTML=head('Tout, au même endroit.','Vos informations et documents restent personnels.')+section('Informations personnelles')+row('user','Mon profil','Coordonnées, situation et garant','profil')+section('Documents')+row('files',stage==='candidat'?'Pièces de candidature':'Bail et attestations',stage==='candidat'?'3 pièces reçues · 1 pièce manquante':'Bail, assurance, quittances et CAF','pieces')+row('clipboard-check','États des lieux','Entrée, sortie, observations et photos','edl')+section('Mes démarches')+row('key-round','Arrivée et départ','Étapes, documents et rendez-vous','arrivee');
else m.innerHTML=head('Gardons le contact.','Vos échanges privés avec Nicolas.')+row('message-circle','Nicolas · Propriétaire','Votre document a bien été reçu.','message','10:24')+row('wrench','Fuite sous l’évier','Prise en charge · Intervention à programmer','message')+'<button class="cta" data-action="message">Nouvelle demande</button>';icons();}
r.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.stage){stage=b.dataset.stage;page='Accueil';r.querySelectorAll('[data-stage]').forEach(x=>x.classList.toggle('active',x===b));render();return;}if(b.dataset.page){page=b.dataset.page;render();return;}const a=b.dataset.action;if(b.classList.contains('bell')){m.innerHTML=head('Vos notifications.','Les événements de votre dossier et de la coloc.')+row('file-check','Document reçu','En attente de vérification','dossier')+row('calendar-days','Visite confirmée','Vendredi 16 octobre · 18:30','cal');}else if(a==='dossier'){page='Mon dossier';render();}else if(a==='coloc'){page='La coloc';render();}else if(a==='cal'){m.innerHTML=head(stage==='candidat'?'Choisir ma visite.':'Mon calendrier.',stage==='candidat'?'Créneaux proposés par les colocataires disponibles.':'Vos disponibilités pour accueillir les candidats.')+'<div class="days">'+['Lun 12','Mar 13','Mer 14','Jeu 15','Ven 16'].map(t=>`<button data-action="day">${t}</button>`).join('')+'</div>'+row('clock','Vendredi · 18:30','Camille vous accueille · Visite de 30 minutes','reserve')+'<button class="cta" data-action="dispo">'+(stage==='candidat'?'Demander ce créneau':'Ajouter une disponibilité')+'</button>';}else if(a==='day'){r.querySelectorAll('.days button').forEach(x=>x.classList.toggle('active',x===b));}else if(a==='entretien'){m.innerHTML=head('L’entretien de la semaine.','12 – 18 octobre · Rotation des espaces communs')+row('sparkles','Cuisine · Léa','Plan de travail, plaques et sol','','À faire')+row('sparkles','Salle de bain · Hugo','Lavabo, douche et sol','','Terminé')+row('sparkles','Entrée · Sarah','Sol et rangement','','À faire')+'<button class="cta" data-action="done">Marquer ma tâche terminée</button>';}else if(a==='done'){b.textContent='✓ Tâche terminée';b.disabled=true;}else if(a==='edl'){m.innerHTML=head('Chambre Jardin.','État des lieux d’entrée · Préparation · 1 / 6')+'<label>Mes observations<textarea placeholder=" </script>
